apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-js-app-deployment
  labels:
    app: k8s-js-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-js-app
  template:
    metadata:
      labels:
        app: k8s-js-app
    spec:
      containers:
      - name: k8s-js-app
        image: mamun723/k8s-js-app:v1
        ports:
        - containerPort: 3000
